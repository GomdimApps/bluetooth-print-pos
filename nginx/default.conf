server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Convenience: opening the root already takes you straight to the demo.
    # Uses $http_host (not $host) to preserve the port mapped by Docker
    # (e.g. :3000) in the Location header, instead of the container's internal port (80).
    location = / {
        return 302 $scheme://$http_host/demo/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
